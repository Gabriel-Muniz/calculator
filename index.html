<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator-body">
        <div class="calculator-display-container">
            <span class="secondary-display">1738</span>
            <span class="main-display">0</span>
        </div>
        <div class="calculator-buttons-container">

            <div class="digits-container">
                <button class="digit-btn" value="0">0</button>
                <button class="digit-btn" value="1">1</button>
                <button class="digit-btn" value="2">2</button>
                <button class="digit-btn" value="3">3</button>
                <button class="digit-btn" value="4">4</button>
                <button class="digit-btn" value="5">5</button>
                <button class="digit-btn" value="6">6</button>
                <button class="digit-btn" value="7">7</button>
                <button class="digit-btn" value="8">8</button>
                <button class="digit-btn" value="9">9</button>
                <button class="digit-btn decimal-btn" value=".">&sdot;</button>
            </div>

            <div class="operations-container">
                <button class="action-btn erase-btn" value="erase">&#11013</button>
                <button class="action-btn clear-btn" value="clear">C</button>
                <button class="operation-btn" value="divide">&divide;</button>
                <button class="operation-btn" value="subtract">&minus;</button>
                <button class="operation-btn" value="multiply">&times;</button>
                <button class="operation-btn" value="add">&plus;</button>
                <button class="action-btn equal-btn" value="equal">&equals;</button>
            </div>
        </div>
    </div>
</body>

</html>
